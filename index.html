<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store API Integration</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body{
            font-family:Arial, Helvetica, sans-serif;
            background:linear-gradient(135deg,#1e3c72,#2a5298);
            padding:30px;
        }
        
        h1{
            text-align:center;
            color:#fff;
            margin-bottom:30px;
            font-size:40px;
            letter-spacing:2px;
        }
        
        .search-container{
            display:flex;
            justify-content:center;
            gap:15px;
            margin-bottom:30px;
        }
        
        input{
            width:350px;
            padding:12px 15px;
            border:none;
            border-radius:30px;
            outline:none;
            font-size:16px;
        }
        
        button{
            padding:12px 25px;
            border:none;
            border-radius:30px;
            background:#ff9800;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }
        
        button:hover{
            background:#ff6f00;
            transform:scale(1.05);
        }
        
        #result{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
            gap:25px;
        }
        
        .card{
            background:#ffffff;
            border-radius:15px;
            padding:20px;
            box-shadow:0 10px 20px rgba(0,0,0,.25);
            transition:.3s;
        }
        
        .card:hover{
            transform:translateY(-10px);
        }
        
        .number{
            width:40px;
            height:40px;
            border-radius:50%;
            background:#ff9800;
            color:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            font-weight:bold;
            margin-bottom:15px;
        }
        
        .card img{
            width:100%;
            height:220px;
            object-fit:contain;
            margin-bottom:15px;
        }
        
        .card h4{
            color:#1e3c72;
            margin-bottom:10px;
        }
        
        .card p{
            color:#555;
            line-height:1.6;
        }
        
        .price{
            color:#16a34a;
            font-size:22px;
            font-weight:bold;
        }
        
        .category{
            color:#ff6f00;
            font-weight:bold;
        }
        
        @media(max-width:768px){
        
            .search-container{
                flex-direction:column;
            }
        
            input,
            button{
                width:100%;
            }
        
            #result{
                grid-template-columns:1fr;
            }
        }
        </style>
</head>

<body>

    <h1> MUJEEB BHAI KI DUKAAN</h1>

    <div class="search-container">
        <input placeholder="Search Product..." id="search_input">
        <button id="search_btn">Search</button>
    </div>

    <div id="result"></div>

    <script>

        let result = document.getElementById("result");
        let search_input = document.getElementById("search_input");
        let search_btn = document.getElementById("search_btn");

        let allProducts = [];

        let renderCards = (products) => {

            result.innerHTML = "";

            if(products.length===0){
                result.innerHTML="<h2>No Product Found!</h2>";
                return;
            }

            products.forEach((product,index)=>{

                let card=`

                <div class="card">

                    <div class="number">${index+1}</div>

                    <img src="${product.image}">

                    <h4>${product.title}</h4>

                    <p class="price">$ ${product.price}</p>

                    <p class="category">${product.category}</p>

                    <p>
                    ${product.description.substring(0,120)}...
                    </p>

                </div>

                `;

                result.innerHTML+=card;

            });

        }

        let renderList = ()=>{

            fetch("https://fakestoreapi.com/products")

            .then(res=>res.json())

            .then((data)=>{

                allProducts=data;

                renderCards(allProducts);

            })

            .catch((err)=>{

                console.log(err);

                result.innerHTML="<h2>Something went wrong!</h2>";

            });

        }

        renderList();

        let searchProduct=()=>{

            let query=search_input.value.toLowerCase().trim();

            if(query===""){

                renderCards(allProducts);

            }

            else{

                let filterProducts=allProducts.filter((product)=>{

                    return product.title.toLowerCase().includes(query) ||

                    product.category.toLowerCase().includes(query);

                });

                renderCards(filterProducts);

            }

        }

        search_btn.addEventListener("click",searchProduct);

        search_input.addEventListener("keypress",(event)=>{

            if(event.key==="Enter"){

                searchProduct();

            }

        });

    </script>

</body>

</html>
