<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booking</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --bg: #090114;
            --panel: rgba(20, 20, 35, .88);
            --panel2: rgba(35, 35, 55, .9);
            --cyan: #00f7ff;
            --purple: #a100ff;
            --pink: #ff008c;
            --text: #ffffff;
            --muted: #b6b6d2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: var(--text);

            background:
                linear-gradient(rgba(5, 5, 20, .80), rgba(5, 5, 20, .90)),
                url("https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1800&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 55px;
            color: var(--cyan);
            text-shadow: 0 0 10px var(--cyan),
                0 0 20px var(--cyan),
                0 0 40px var(--cyan);
            letter-spacing: 3px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-top: 10px;
            margin-bottom: 35px;
            font-size: 18px;
        }

        .intake {
            max-width: 1100px;
            margin: auto;
            background: var(--panel);
            backdrop-filter: blur(12px);
            border: 2px solid var(--cyan);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 247, 255, .25);
        }

        .intake::before {
            content: "HOTEL";
            float: right;
            color: var(--pink);
            font-weight: bold;
            letter-spacing: 2px;
        }

        .intake-fields {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        input {
            flex: 1;
            min-width: 220px;
            padding: 14px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: var(--panel2);
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #bdbddd;
        }

        input:focus {
            box-shadow: 0 0 15px var(--cyan);
        }

        button {
            background: linear-gradient(90deg, var(--cyan), var(--purple));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 15px var(--cyan),
                0 0 30px var(--purple);
        }

        #rooms_list {
            max-width: 1200px;
            margin: 40px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }

        .room-card {
            width: 260px;
            background: var(--panel);
            border: 2px solid rgba(0, 247, 255, .3);
            border-radius: 20px;
            overflow: hidden;
            transition: .35s;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 247, 255, .15);
        }

        .room-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: var(--cyan);
            box-shadow: 0 0 20px var(--cyan),
                0 0 40px var(--purple);
        }

        .thumb-wrap {
            height: 180px;
            overflow: hidden;
        }

        .room-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .4s;
        }

        .room-card:hover img {
            transform: scale(1.1);
        }

        .info {
            padding: 18px;
        }

        .name {
            font-size: 24px;
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 12px;
            color: white;
        }

        .price {
            display: inline-block;
            background: linear-gradient(90deg, var(--purple), var(--pink));
            padding: 8px 15px;
            border-radius: 30px;
            font-weight: bold;
            color: white;
        }

        .empty-state {
            width: 100%;
            text-align: center;
            padding: 50px;
            background: var(--panel);
            border-radius: 15px;
            color: #ddd;
            border: 2px dashed var(--cyan);
        }

        @media(max-width:700px) {

            .intake-fields {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .room-card {
                width: 100%;
            }

            h1 {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <h1>🏨 Room Booking</h1>
    <p class="subtitle">// Find & Add Your Favorite Rooms</p>

    <div class="intake">

        <div class="intake-fields">

            <input type="text" id="room_name" placeholder="Room Name">

            <input type="text" id="room_price" placeholder="Price Per Night">

            <input type="url" id="room_img" placeholder="Room Image URL">

            <button id="addRoomBtn">
                Add Room
            </button>

        </div>

    </div>

    <div id="rooms_list"></div>

    <script>

        let rooms_list = document.getElementById("rooms_list");
        let room_name = document.getElementById("room_name");
        let room_price = document.getElementById("room_price");
        let room_img = document.getElementById("room_img");
        let add_room_btn = document.getElementById("addRoomBtn");

        let rooms = [

            {
                name: "Deluxe Room",
                price: "$120 / Night",
                thumbnail: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600"
            },

            {
                name: "Family Suite",
                price: "$220 / Night",
                thumbnail: "https://images.unsplash.com/photo-1578683010236-d716f9a3f461?w=600"
            },

            {
                name: "Single Room",
                price: "$80 / Night",
                thumbnail: "https://images.unsplash.com/photo-1590490360182-c33d57733427?w=600"
            }

        ];

        function renderRooms() {

            rooms_list.innerHTML = "";

            if (rooms.length === 0) {

                rooms_list.innerHTML = `
                <div class="empty-state">
                    No Rooms Available
                </div>
                `;

                return;
            }

            rooms.forEach((room) => {

                let card = `
                <div class="room-card">

                    <div class="thumb-wrap">

                        <img src="${room.thumbnail}" alt="${room.name}"
                        onerror="this.src='https://placehold.co/260x180/111/fff?text=Room'">

                    </div>

                    <div class="info">

                        <h2 class="name">${room.name}</h2>

                        <span class="price">
                            ${room.price}
                        </span>

                    </div>

                </div>
                `;

                rooms_list.innerHTML += card;

            });

        }

        renderRooms();

        function addRoom() {

            if (
                room_name.value.trim() === "" ||
                room_price.value.trim() === ""
            ) {

                alert("Please fill all required fields.");
                return;

            }

            let room = {

                name: room_name.value.trim(),

                price: room_price.value.trim(),

                thumbnail: room_img.value.trim() ||
                    "https://placehold.co/260x180/111/fff?text=Room"

            };

            rooms.push(room);

            renderRooms();

            room_name.value = "";
            room_price.value = "";
            room_img.value = "";

            room_name.focus();

        }

        add_room_btn.addEventListener("click", addRoom);

        document.addEventListener("keydown", function (e) {

            if (e.key === "Enter") {

                addRoom();

            }

        });

    </script>

</body>

</html>
